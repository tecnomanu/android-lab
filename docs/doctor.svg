<text x="188.4" y="159.0" fill="#c9d1d9" xml:space="preserve"> ~/.android-lab</text>
<text x="36.8" y="180.0" fill="#6e7681" xml:space="preserve">free space        </text>
<text x="188.4" y="180.0" fill="#c9d1d9" xml:space="preserve"> 1738 GB</text>
<text x="20.0" y="222.0" fill="#c9d1d9" xml:space="preserve">  capabilities</text>
<text x="36.8" y="264.0" fill="#6e7681" xml:space="preserve">virtualisation    </text>
<text x="196.8" y="264.0" fill="#3fb950" xml:space="preserve">yes</text>
<text x="230.5" y="264.0" fill="#6e7681" xml:space="preserve">Hypervisor.framework</text>
<text x="36.8" y="285.0" fill="#6e7681" xml:space="preserve">docker            </text>
<text x="196.8" y="285.0" fill="#3fb950" xml:space="preserve">yes</text>
<text x="230.5" y="285.0" fill="#6e7681" xml:space="preserve">Docker Desktop</text>
<text x="36.8" y="306.0" fill="#6e7681" xml:space="preserve">binder (kernel)   </text>
<text x="196.8" y="306.0" fill="#ff7b72" xml:space="preserve">no</text>
<text x="222.1" y="306.0" fill="#6e7681" xml:space="preserve">the Docker Desktop kernel on macOS has no binder (CONFIG_ANDROID_BINDER_IPC)</text>
<text x="20.0" y="348.0" fill="#c9d1d9" xml:space="preserve">  tools</text>
<text x="36.8" y="390.0" fill="#6e7681" xml:space="preserve">adb               </text>
<text x="196.8" y="390.0" fill="#3fb950" xml:space="preserve">yes</text>
<text x="230.5" y="390.0" fill="#6e7681" xml:space="preserve">~/.android-lab/sdk/platform-tools/adb</text>
<text x="36.8" y="411.0" fill="#6e7681" xml:space="preserve">scrcpy            </text>
<text x="196.8" y="411.0" fill="#3fb950" xml:space="preserve">yes</text>
<text x="230.5" y="411.0" fill="#6e7681" xml:space="preserve">/opt/homebrew/bin/scrcpy</text>
<text x="36.8" y="432.0" fill="#6e7681" xml:space="preserve">java              </text>
<text x="196.8" y="432.0" fill="#3fb950" xml:space="preserve">yes</text>
<text x="230.5" y="432.0" fill="#6e7681" xml:space="preserve">/opt/homebrew/opt/openjdk@17</text>
<text x="36.8" y="453.0" fill="#6e7681" xml:space="preserve">movicom           </text>
<text x="196.8" y="453.0" fill="#3fb950" xml:space="preserve">yes</text>
<text x="230.5" y="453.0" fill="#6e7681" xml:space="preserve">semantic UI control</text>
<text x="36.8" y="474.0" fill="#6e7681" xml:space="preserve">apx               </text>
<text x="196.8" y="474.0" fill="#3fb950" xml:space="preserve">yes</text>
<text x="230.5" y="474.0" fill="#6e7681" xml:space="preserve">agent orchestration</text>
<text x="20.0" y="516.0" fill="#c9d1d9" xml:space="preserve">  backends</text>
<text x="36.8" y="558.0" fill="#3fb950" xml:space="preserve">●</text>
<text x="53.7" y="558.0" fill="#f0f6fc" font-weight="600" xml:space="preserve">emulator </text>
<text x="137.9" y="558.0" fill="#6e7681" xml:space="preserve">ready · arm64-v8a image</text>
<text x="36.8" y="579.0" fill="#6e7681" xml:space="preserve">○</text>
<text x="53.7" y="579.0" fill="#f0f6fc" font-weight="600" xml:space="preserve">redroid  </text>
<text x="137.9" y="579.0" fill="#6e7681" xml:space="preserve">the Docker Desktop kernel on macOS has no binder (CONFIG_ANDROID_BINDER_IPC)</text>
<text x="20.0" y="621.0" fill="#c9d1d9" xml:space="preserve">  selected backend: </text>
<text x="188.4" y="621.0" fill="#39c5cf" xml:space="preserve">emulator</text>
<text x="20.0" y="663.0" fill="#c9d1d9" xml:space="preserve">  devices</text>
<text x="36.8" y="705.0" fill="#6e7681" xml:space="preserve">emulator          </text>
<text x="196.8" y="705.0" fill="#3fb950" xml:space="preserve">running</text>
<text x="36.8" y="726.0" fill="#6e7681" xml:space="preserve">redroid           </text>
<text x="196.8" y="726.0" fill="#6e7681" xml:space="preserve">not installed</text>
<text x="36.8" y="768.0" fill="#6e7681" xml:space="preserve">redroid does not exist on macOS: Docker Desktop runs a LinuxKit kernel with no binder.</text>
<text x="36.8" y="789.0" fill="#6e7681" xml:space="preserve">It is not a permissions or flags problem — the subsystem is not compiled in.</text>
